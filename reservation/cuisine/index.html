<title>Wellington · Réservations cuisine</title>
<style>
:root { color-scheme:light; --vert:#203f37; --encre:#202e28; --second:#53665b; --ligne:#d9dfd5; --papier:#f7f7f0; }
* { box-sizing:border-box }
body { margin:0; background:var(--papier); color:var(--encre); font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif }
main, .barre { max-width:880px; margin:auto; padding:0 24px }
header { background:#fffef9; border-bottom:1px solid var(--ligne) }
.barre { height:76px; display:flex; align-items:center; gap:12px }
.logo { width:45px; height:45px; border-radius:11px }
.marque { font:600 22px Georgia,serif; letter-spacing:-.5px }
.consultation { margin-left:auto; color:var(--second); font-size:13px }
main { padding-bottom:40px }
.entete { margin:32px 0 18px; display:flex; align-items:flex-end; flex-wrap:wrap; justify-content:space-between; gap:14px }
h1 { font:normal clamp(34px,6vw,49px)/1.1 Georgia,serif; margin:3px 0 0; color:var(--vert); letter-spacing:-1.2px }
.kicker { margin:0; font-size:13px; color:var(--second); font-weight:600 }
button, input { color:var(--encre); font:inherit }
button { cursor:pointer }
button:focus-visible, input:focus-visible, summary:focus-visible { outline:3px solid #947237; outline-offset:3px }
.jours { display:flex; align-items:center; gap:5px }
.jours button, .jours input, #actualiser { min-height:44px; border:1px solid var(--ligne); border-radius:10px; background:#fffef9; padding:6px 10px }
.jours button { min-width:44px; color:var(--vert); font-size:22px; line-height:1 }
.jours input { max-width:162px; min-width:0 }
.bilan { border-radius:16px; color:#fff; background:var(--vert); display:grid; grid-template-columns:1fr 1fr; padding:19px 0; margin:22px 0 18px }
.chiffre { padding:0 24px; display:flex; flex-direction:column }
.chiffre + .chiffre { border-left:1px solid #597064 }
.chiffre strong { font:normal 36px/1.08 Georgia,serif; font-variant-numeric:tabular-nums }
.chiffre span { font-size:14px; color:#e3ebe4; margin-top:5px }
.filtres { display:flex; gap:5px; background:#e7ebe3; padding:4px; border-radius:12px; width:max-content; max-width:100% }
.filtres button { border:0; border-radius:9px; background:transparent; min-height:42px; padding:7px 17px; font-size:15px }
.filtres button[aria-pressed=true] { background:white; color:var(--vert); font-weight:650; box-shadow:0 1px 4px #203f3719 }
h2 { font:normal 25px Georgia,serif; margin:24px 0 11px; color:var(--vert) }
.liste { background:white; border:1px solid var(--ligne); border-radius:14px; overflow:hidden }
details + details { border-top:1px solid var(--ligne) }
summary { list-style:none; display:grid; grid-template-columns:64px 1fr auto; align-items:start; gap:14px; padding:16px; cursor:pointer }
summary::-webkit-details-marker { display:none }
.horaire { font-weight:700; font-variant-numeric:tabular-nums; line-height:1.25 }
.horaire small { display:block; color:var(--second); font-weight:400; margin-top:4px }
.nom { display:block; font-size:18px; font-weight:650; overflow-wrap:anywhere }
.placement { display:block; color:var(--second); margin-top:3px; font-size:14px }
.etat { font-weight:600; font-size:13px; color:var(--vert); display:block; margin-top:4px }
.annulee .nom { text-decoration:line-through; color:var(--second) }
.annulee .etat { color:#864523 }
.fleche { color:var(--second); font-size:21px; transition:transform .12s; line-height:1.2 }
details[open] .fleche { transform:rotate(90deg) }
.note { display:block; color:#4a4d36; margin-top:6px; font-size:14px; white-space:pre-line; overflow-wrap:anywhere }
.detail { padding:0 16px 16px 94px; font-size:14px; color:var(--second); overflow-wrap:anywhere }
.detail p { margin:4px 0 }
#message { margin:14px 0 0; color:var(--second) }
#message:empty { display:none }
#suivi { margin-top:20px; display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--second); font-size:13px }
#actualiser { color:var(--vert); font-weight:600 }
@media(max-width:560px) { main,.barre{padding-left:16px;padding-right:16px}.barre{height:61px}.entete{margin-top:22px}.jours{width:100%}.jours input{flex:1;max-width:none;text-align:center}.bilan{margin-top:18px}.chiffre{padding:0 15px}.filtres{width:100%}.filtres button{flex:1;padding:7px 9px}summary{gap:10px;grid-template-columns:50px 1fr auto;padding:14px 12px}.detail{padding-left:72px}}
[hidden] {display:none!important}
.connexion {margin-top:32px;border:1px solid var(--ligne);border-radius:16px;background:#fffef9;padding:24px}
.connexion h2 {margin:0 0 8px}
.connexion p {margin:0 0 15px}
#connecter {border:0;border-radius:10px;background:var(--vert);color:white;padding:12px 18px;font-weight:650}
#quitter {background:none;border:0;color:var(--second);text-decoration:underline;padding:8px;cursor:pointer}
</style>
</head>
